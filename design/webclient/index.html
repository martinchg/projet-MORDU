<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MORDU — onboarding « ça ou ça »</title>
<style>
  :root{ --bg:#08090B; --panel:#0E1013; --ink:#E9E7DD; --mut:#83837B; --line:rgba(255,255,255,.12); --red:#E4130F; --green:#3FA45A;
    --disp:"Impact","Haettenschweiler","Arial Narrow",sans-serif; --sans:-apple-system,"Helvetica Neue",Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,monospace; }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:920px;margin:0 auto;padding:24px 20px 60px}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{font-family:var(--disp);font-size:40px;letter-spacing:.02em;text-transform:uppercase;text-shadow:3px 3px 0 var(--red);margin:0}
  .status{font-family:var(--mono);font-size:12px;padding:6px 10px;border:1px solid var(--line)}
  .status.ok{color:var(--green);border-color:var(--green)} .status.ko{color:var(--red);border-color:var(--red)}

  /* onboarding */
  .prompt{font-family:var(--disp);text-transform:uppercase;font-size:clamp(26px,4vw,40px);letter-spacing:.01em;text-shadow:2px 2px 0 var(--red);margin:30px 0 4px}
  .progress{font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
  .bar{height:3px;background:#20242a;margin:10px 0 22px}
  .bar i{display:block;height:100%;background:var(--red);transition:width .3s}
  .versus{display:flex;gap:14px;align-items:stretch}
  .pick{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:transform .14s,border-color .14s;text-align:left}
  .pick:hover{transform:translateY(-5px);border-color:var(--red)}
  .pick:focus-visible{outline:2px solid var(--red);outline-offset:2px}
  .pick .art{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#111}
  .pick .cap{padding:12px 12px 14px}
  .pick .t{font-family:var(--disp);text-transform:uppercase;font-size:18px;line-height:1.02;text-shadow:1.5px 1.5px 0 var(--red)}
  .pick .y{font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:4px}
  .vs{align-self:center;font-family:var(--disp);color:var(--red);font-size:22px;flex:0 0 auto}
  .skip{display:block;margin:22px auto 0;background:none;border:0;color:var(--mut);font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:underline}
  .skip:hover{color:var(--ink)}

  /* résultats */
  h2{font-family:var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:.02em;font-size:24px;text-shadow:2px 2px 0 var(--red);margin:28px 0 4px}
  .hint{color:var(--mut);font-size:13px;margin:0 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:transform .14s,border-color .14s}
  .card:hover{transform:translateY(-4px);border-color:var(--red)}
  .card .art{aspect-ratio:2/3;width:100%;object-fit:cover;display:block;background:#111}
  .card canvas.art{image-rendering:pixelated}
  .card .body{padding:8px 10px 11px}
  .card .t{font-family:var(--disp);text-transform:uppercase;font-size:14px;line-height:1.02;text-shadow:1.5px 1.5px 0 var(--red)}
  .card .y{font-family:var(--mono);font-size:10px;color:var(--mut);margin:3px 0 4px}
  .card .imdb{font-family:var(--mono);font-size:10px;color:#E0A93A;margin:0 0 6px}
  .card .imdb b{color:#E0A93A;font-weight:700}
  .card .score{height:4px;background:#20242a} .card .score i{display:block;height:100%;background:var(--red)}
  .card .sv{font-family:var(--mono);font-size:10px;color:var(--red);margin-top:4px}
  .btn{background:var(--red);color:#0b0b0b;border:0;font-family:var(--disp);text-transform:uppercase;letter-spacing:.04em;font-size:16px;padding:11px 20px;cursor:pointer;margin-top:8px}
  .btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
  .banner{padding:14px 16px;border:1px solid var(--red);font-size:14px;line-height:1.5;background:rgba(228,19,15,.08);margin-top:16px}
  .banner code{font-family:var(--mono);color:var(--red)}
  .empty{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 class="brand">MORDU</h1>
    <span class="status" id="status">connexion…</span>
  </div>
  <div id="app"><p class="empty">…</p></div>
</div>

<script>
const API = new URLSearchParams(location.search).get("api") || "http://127.0.0.1:8000";
const N_PAIRS = 7;
let pairs=[], cur=0, liked=[], disliked=[];

const statusEl=document.getElementById("status");
const app=document.getElementById("app");
function setStatus(ok,txt){ statusEl.className="status "+(ok?"ok":"ko"); statusEl.textContent=txt; }

async function GET(p){ const r=await fetch(API+p); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
async function POST(p,b){ const r=await fetch(API+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }

function apiDown(){
  setStatus(false,"API hors ligne");
  app.innerHTML=`<div class="banner"><b>API injoignable</b> sur <code>${API}</code>.<br>
  Lance le moteur dans un terminal :<br>
  <code>cd backend &amp;&amp; source venv/bin/activate &amp;&amp; uvicorn main:app --reload</code><br>
  puis recharge la page.</div>`;
}

function esc(s){ return (s||"").replace(/"/g,"&quot;"); }

function renderPair(){
  const p=pairs[cur];
  app.innerHTML=`
    <div class="prompt">Tu préfères…</div>
    <div class="progress">Choix ${cur+1} / ${pairs.length}</div>
    <div class="bar"><i style="width:${(cur/pairs.length)*100}%"></i></div>
    <div class="versus">
      <button class="pick" data-win="${p.a.id}" data-lose="${p.b.id}">
        <img class="art" src="${p.a.poster_url||''}" alt="">
        <div class="cap"><div class="t">${p.a.title}</div><div class="y">${p.a.year||''}</div></div>
      </button>
      <div class="vs">OU</div>
      <button class="pick" data-win="${p.b.id}" data-lose="${p.a.id}">
        <img class="art" src="${p.b.poster_url||''}" alt="">
        <div class="cap"><div class="t">${p.b.title}</div><div class="y">${p.b.year||''}</div></div>
      </button>
    </div>
    <button class="skip" id="skip">Je ne connais ni l'un ni l'autre — passer</button>`;
  app.querySelectorAll(".pick").forEach(b=>b.addEventListener("click",()=>{
    liked.push(+b.dataset.win); disliked.push(+b.dataset.lose); next();
  }));
  document.getElementById("skip").addEventListener("click",next);
}

function next(){ cur++; if(cur>=pairs.length) showResults(); else renderPair(); }

// --- dithering des affiches (via le proxy /api/img pour éviter le canvas 'tainted') ---
const PAL=[[10,12,16],[20,28,40],[34,46,60],[52,74,84],[80,104,112],[120,110,72],[168,138,84],[208,178,120],[234,228,212],[150,58,58],[214,32,28]];
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function _nearest(r,g,b){let bi=0,bd=1e9;for(let i=0;i<PAL.length;i++){const p=PAL[i],dr=r-p[0],dg=g-p[1],db=b-p[2],d=dr*dr+dg*dg+db*db;if(d<bd){bd=d;bi=i;}}return PAL[bi];}
function ditherCanvas(cv,posterUrl){
  if(!posterUrl) return;
  const path=(posterUrl.split('/t/p/w342')[1])||(posterUrl.split('/t/p/')[1]||'').replace(/^w\d+/,'');
  if(!path) return;
  const img=new Image(); img.crossOrigin='anonymous';
  img.onload=()=>{
    const w=cv.width,h=cv.height,ctx=cv.getContext('2d',{willReadFrequently:true});
    const ar=w/h,iar=img.width/img.height; let sw,sh,sx,sy;
    if(iar>ar){sh=img.height;sw=sh*ar;sx=(img.width-sw)/2;sy=0;}else{sw=img.width;sh=sw/ar;sx=0;sy=(img.height-sh)/2;}
    ctx.drawImage(img,sx,sy,sw,sh,0,0,w,h);
    let im; try{im=ctx.getImageData(0,0,w,h);}catch(e){return;}
    const d=im.data;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;
      let r=(d[i]-128)*1.14+128-14,g=(d[i+1]-128)*1.14+128-12,b=(d[i+2]-128)*1.10+128-2;
      const t=(BAYER[y&3][x&3]/16-0.5)*58; r+=t;g+=t;b+=t;
      const c=_nearest(r,g,b); d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];}
    ctx.putImageData(im,0,0);
  };
  img.src=`${API}/api/img?path=${encodeURIComponent(path)}`;
}

async function showResults(){
  app.innerHTML='<h2>Rien qu\'à tes choix</h2><p class="empty">le moteur apprend…</p>';
  try{
    const recos=await POST("/api/recommend",{liked_ids:liked, disliked_ids:disliked, k:12});
    app.innerHTML=`
      <h2>Rien qu'à tes choix</h2>
      <p class="hint">Basé sur ${liked.length} préférences (et ${disliked.length} rejets). Clique une carte pour l'ajouter à tes goûts et affiner en direct.</p>
      <div class="grid" id="grid">${recos.map(r=>`
        <div class="card" data-id="${r.id}">
          <canvas class="art" width="120" height="180" data-poster="${r.poster_url||''}"></canvas>
          <div class="body">
            <div class="t">${r.title}</div><div class="y">${r.year||''}</div>
            ${r.imdb_rating?`<div class="imdb">★ ${r.imdb_rating}${r.imdb_rank?` · <b>Top #${r.imdb_rank} IMDb</b>`:''}</div>`:''}
            <div class="score"><i style="width:${Math.round(r.score*100)}%"></i></div>
            <div class="sv">match ${(r.score*100).toFixed(0)}%</div>
          </div>
        </div>`).join("")}</div>
      <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="again">↻ Recommencer</button>
      </div>`;
    document.querySelectorAll("#grid canvas.art").forEach(cv=>ditherCanvas(cv, cv.dataset.poster));
    document.getElementById("grid").addEventListener("click",e=>{
      const c=e.target.closest(".card[data-id]"); if(!c) return;
      const id=+c.dataset.id; if(!liked.includes(id)) liked.push(id); showResults();
    });
    document.getElementById("again").addEventListener("click",start);
  }catch(e){ apiDown(); }
}

async function start(){
  cur=0; liked=[]; disliked=[];
  app.innerHTML='<p class="empty">chargement…</p>';
  try{
    const h=await GET("/api/health"); setStatus(true,`API connectée · ${h.films} films`);
    pairs=await GET(`/api/onboarding_pairs?n=${N_PAIRS}`);
    if(!pairs.length){ app.innerHTML='<p class="empty">Pas de paires.</p>'; return; }
    renderPair();
  }catch(e){ apiDown(); }
}
start();
</script>
</body>
</html>
