<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MORDU — L'oracle</title>
<style>
  :root{ --bg:#08090B; --panel:#0E1013; --ink:#E9E7DD; --mut:#83837B; --line:rgba(255,255,255,.12);
    --red:#E4130F; --green:#3FA45A;
    --disp:"Impact","Haettenschweiler","Arial Narrow",sans-serif;
    --sans:-apple-system,"Helvetica Neue",Arial,sans-serif; --mono:"SF Mono",ui-monospace,Menlo,monospace; }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 20px 80px}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{font-family:var(--disp);font-size:40px;letter-spacing:.02em;text-transform:uppercase;text-shadow:3px 3px 0 var(--red);margin:0}
  .status{font-family:var(--mono);font-size:11px;padding:6px 10px;border:1px solid var(--line)}
  .status.ok{color:var(--green);border-color:var(--green)} .status.ko{color:var(--red);border-color:var(--red)}
  h2{font-family:var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:.02em;font-size:26px;text-shadow:2px 2px 0 var(--red);margin:26px 0 6px}
  .hint{color:var(--mut);font-size:13px;margin:0 0 22px;max-width:66ch;line-height:1.55}
  .banner{padding:14px 16px;border:1px solid var(--red);font-size:14px;line-height:1.5;background:rgba(228,19,15,.08);margin-top:16px}
  .banner code{font-family:var(--mono);color:var(--red)}

  /* --- les trois cartes --- */
  .cartes{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:8px}
  @media(max-width:820px){.cartes{grid-template-columns:1fr}}
  .carte{border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;cursor:pointer;transition:border-color .16s,transform .16s}
  .carte:hover{border-color:var(--red);transform:translateY(-3px)}
  /* L'affiche ne doit JAMAIS pousser l'argument hors de l'écran : on choisit sur
     l'argument, pas sur la jaquette. D'où le plafond en vh. */
  .carte .frame{position:relative;aspect-ratio:2/3;max-height:38vh;overflow:hidden;background:#0a0c10}
  .carte canvas{width:100%;height:100%;display:block;image-rendering:pixelated;object-fit:cover}
  .carte .reg{position:absolute;left:0;top:0;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;color:#0b0b0b;background:var(--red);padding:4px 8px}
  .carte .body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
  .carte .annonce{font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.04em}
  .carte .arg{font-size:14.5px;line-height:1.45}
  .carte .crou{font-size:12px;line-height:1.45;color:var(--mut);border-left:2px solid var(--red);padding-left:9px}
  .carte .meta{font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:auto;padding-top:8px}
  .carte .titre{font-family:var(--disp);text-transform:uppercase;font-size:19px;line-height:1.03;
    text-shadow:1.5px 1.5px 0 var(--red);opacity:0;transition:opacity .5s;min-height:0}
  .carte.revele .titre{opacity:1}
  .carte.efface{opacity:.18;pointer-events:none;transition:opacity .5s}

  /* --- serrure / ressenti --- */
  .serrure{border:1px solid var(--red);background:rgba(228,19,15,.06);padding:20px;margin-top:10px}
  .serrure h3{font-family:var(--disp);text-transform:uppercase;font-size:22px;margin:0 0 6px;text-shadow:2px 2px 0 var(--red)}
  textarea{width:100%;min-height:130px;background:#07080A;color:var(--ink);border:1px solid var(--line);
    padding:12px;font-family:var(--sans);font-size:14.5px;line-height:1.55;resize:vertical}
  textarea:focus{outline:none;border-color:var(--red)}
  .btn{all:unset;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    padding:11px 18px;border:1px solid var(--red);color:var(--ink);background:#150f0f;margin-top:12px;display:inline-block}
  .btn:hover{background:var(--red);color:#0b0b0b}
  .btn.ghost{border-color:var(--line);background:none;color:var(--mut)}
  .btn.ghost:hover{border-color:var(--ink);color:var(--ink);background:none}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .compte{font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:8px}

  /* --- onboarding --- */
  input[type=text]{background:#07080A;color:var(--ink);border:1px solid var(--line);padding:11px 13px;
    font-family:var(--sans);font-size:14px;width:100%;max-width:420px}
  input[type=text]:focus{outline:none;border-color:var(--red)}
  .res{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:11px;margin-top:14px}
  .res .f{cursor:pointer;border:1px solid transparent}
  .res .f img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#111}
  .res .f.on{border-color:var(--green)}
  .res .f .t{font-size:10.5px;margin-top:4px;line-height:1.15;color:var(--mut)}
  .res .f.on .t{color:var(--green)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 class="brand">MORDU</h1>
    <span class="status" id="status">connexion…</span>
  </div>
  <div id="vue"></div>
</div>

<script>
const API = new URLSearchParams(location.search).get("api") || "http://127.0.0.1:8000";
const vue = document.getElementById("vue"), statusEl = document.getElementById("status");
function setStatus(ok,t){ statusEl.className="status "+(ok?"ok":"ko"); statusEl.textContent=t; }
async function GET(p){ const r=await fetch(API+p); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
async function POST(p,b){ const r=await fetch(API+p,{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify(b)}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }

/* ---------- dither : le langage visuel de l'app ---------- */
const PAL=[[10,12,16],[20,28,40],[34,46,60],[52,74,84],[80,104,112],[120,110,72],[168,138,84],[208,178,120],[234,228,212],[150,58,58],[214,32,28]];
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function nearest(r,g,b){let bi=0,bd=1e9;for(let i=0;i<PAL.length;i++){const p=PAL[i],dr=r-p[0],dg=g-p[1],db=b-p[2],d=dr*dr+dg*dg+db*db;if(d<bd){bd=d;bi=i;}}return PAL[bi];}
const imgCache={};
function loadImg(path){
  if(!path) return null;
  if(imgCache[path]) return imgCache[path];
  const im=new Image(); im.crossOrigin="anonymous";
  im.src=`${API}/api/img?path=${encodeURIComponent(path)}&w=342`;
  imgCache[path]=im; return im;
}
// m = 0 (illisible) -> 1 (net et en couleur). C'est le seul geste de l'app.
function peindre(cv, im, m){
  const net = m>=0.999;
  const bw = net?300:Math.max(11, Math.round(11 + 150*m*m));
  const bh = Math.round(bw*3/2);
  cv.width=bw; cv.height=bh;
  const ctx=cv.getContext("2d",{willReadFrequently:true});
  ctx.fillStyle="#0a0c10"; ctx.fillRect(0,0,bw,bh);
  if(im && im.complete && im.naturalWidth){
    const ar=bw/bh, iar=im.width/im.height; let sw,sh,sx,sy;
    if(iar>ar){sh=im.height;sw=sh*ar;sx=(im.width-sw)/2;sy=0;}
    else{sw=im.width;sh=sw/ar;sx=0;sy=(im.height-sh)/2;}
    ctx.drawImage(im,sx,sy,sw,sh,0,0,bw,bh);
  }
  if(net) return;
  let dat; try{dat=ctx.getImageData(0,0,bw,bh);}catch(e){return;}
  const d=dat.data;
  for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){const i=(y*bw+x)*4;
    let r=(d[i]-128)*1.14+128-14,g=(d[i+1]-128)*1.14+128-12,b=(d[i+2]-128)*1.10+128-2;
    const t=(BAYER[y&3][x&3]/16-0.5)*58; r+=t;g+=t;b+=t;
    const c=nearest(r,g,b); d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];}
  ctx.putImageData(dat,0,0);
}
function monter(cv, path, m){
  const im=loadImg(path);
  const go=()=>peindre(cv,im,m);
  if(im && !im.complete){ im.addEventListener("load",go,{once:true}); im.addEventListener("error",go,{once:true}); }
  go();
}
// LA révélation : le film se résout sous tes yeux quand tu t'engages.
function reveler(cv, path, ms=1500){
  const im=loadImg(path), t0=performance.now();
  return new Promise(res=>{
    (function frame(t){
      const p=Math.min(1,(t-t0)/ms);
      const e=1-Math.pow(1-p,3);          // easing : lent à la fin, on savoure
      peindre(cv,im,e);
      if(p<1) requestAnimationFrame(frame); else res();
    })(t0);
  });
}

/* ---------- vues ---------- */
let etat={};

async function router(){
  try{
    const h=await GET("/api/health");
    etat=await GET("/api/etat");
    setStatus(true,`oracle en ligne · ${h.films} films · ${etat.aretes} arêtes`);
  }catch(e){
    setStatus(false,"API hors ligne");
    vue.innerHTML=`<div class="banner"><b>API injoignable</b> sur <code>${API}</code>.
      Lance <code>uvicorn main:app --reload</code> depuis <code>backend/</code> et recharge.</div>`;
    return;
  }
  const o=await GET("/api/oracle");
  if(o.besoin_onboarding) return vueOnboarding();
  if(o.bloque) return vueSerrure(o.en_attente);
  return vueCartes(o.cartes);
}

/* --- 1. onboarding : des arêtes, pas des cases à cocher --- */
function vueOnboarding(){
  vue.innerHTML=`<h2>D'abord, trois films</h2>
    <p class="hint">Cite trois films que tu as <b>adorés</b>. Pas les meilleurs — ceux qui sont restés.
    C'est tout ce dont j'ai besoin pour commencer ; le reste, tu me le raconteras au fil des soirs.</p>
    <input type="text" id="q" placeholder="cherche un film…" autocomplete="off">
    <div class="res" id="res"></div>
    <div class="row"><button class="btn" id="ok" style="display:none">Commencer →</button>
      <span class="compte" id="cpt">0 / 3</span></div>`;
  const q=document.getElementById("q"), res=document.getElementById("res"),
        ok=document.getElementById("ok"), cpt=document.getElementById("cpt");
  let choisis=[], last=0;
  q.addEventListener("input",async()=>{
    const s=q.value.trim(); if(s.length<2){res.innerHTML="";return;}
    const t=++last; const films=await GET(`/api/movies?search=${encodeURIComponent(s)}&limit=12`);
    if(t!==last) return;
    // on passe par le proxy /api/img : le CDN TMDB n'est pas toujours joignable côté
    // navigateur, alors que le backend, lui, l'atteint — une vignette vide tuerait
    // l'onboarding.
    res.innerHTML=films.map(f=>`<div class="f${choisis.find(c=>c.id===f.id)?' on':''}" data-id="${f.id}">
      <img src="${f.poster_path?`${API}/api/img?path=${encodeURIComponent(f.poster_path)}&w=185`:''}"
        alt="" loading="lazy"><div class="t">${f.title}</div></div>`).join("");
    res.querySelectorAll(".f").forEach(el=>el.addEventListener("click",()=>{
      const f=films.find(x=>x.id==el.dataset.id);
      const i=choisis.findIndex(c=>c.id===f.id);
      if(i>=0) choisis.splice(i,1); else if(choisis.length<3) choisis.push(f);
      el.classList.toggle("on");
      cpt.textContent=`${choisis.length} / 3`;
      ok.style.display=choisis.length===3?"inline-block":"none";
    }));
  });
  ok.addEventListener("click",async()=>{
    await POST("/api/graines",{ids:choisis.map(c=>c.id)});
    router();
  });
}

/* --- 2. les trois cartes, à l'aveugle --- */
function vueCartes(cartes){
  if(!cartes || !cartes.length){
    vue.innerHTML=`<div class="banner">Pas de tirage possible — catalogue trop filtré.</div>`; return;
  }
  vue.innerHTML=`<h2>Ce soir</h2>
    <p class="hint">Trois directions. Tu ne choisis pas un film parmi des milliers —
    tu me dis de quoi tu as <b>envie</b>. Les affiches restent tramées : choisis sur l'argument,
    pas sur la jaquette. Le film se révèle après.</p>
    <div class="cartes">${cartes.map((c,i)=>`
      <div class="carte" data-i="${i}">
        <div class="frame"><canvas></canvas><span class="reg">${c.label}</span></div>
        <div class="body">
          <div class="annonce">${c.annonce}</div>
          <div class="titre"></div>
          <div class="arg">${c.argument}</div>
          ${c.croustillant?`<div class="crou">${c.croustillant}</div>`:``}
          <div class="meta">affinité ${c.affinite.toFixed(2)}</div>
        </div>
      </div>`).join("")}</div>`;
  const els=[...vue.querySelectorAll(".carte")];
  els.forEach((el,i)=>{
    monter(el.querySelector("canvas"), cartes[i].poster_path, 0.045);   // illisible
    el.addEventListener("click",()=>choisir(el,els,cartes,i),{once:true});
  });
}

async function choisir(el, els, cartes, i){
  const c=cartes[i];
  els.forEach((x,j)=>{ if(j!==i) x.classList.add("efface"); x.style.pointerEvents="none"; });
  await reveler(el.querySelector("canvas"), c.poster_path);
  el.classList.add("revele");
  el.querySelector(".titre").textContent=`${c.title} (${c.year})`;
  const dispo=(c.providers_fr||[]).slice(0,3).join(" · ");
  el.querySelector(".meta").innerHTML=
    `${c.runtime||"?"} min · ${(c.genres||[]).join(", ")}${dispo?`<br>${dispo}`:""}`;
  await POST("/api/choix",{film_id:c.id,titre:c.title,registre:c.registre});
  const bloc=document.createElement("div");
  bloc.className="serrure"; bloc.style.marginTop="22px";
  bloc.innerHTML=`<h3>C'est parti</h3>
    <p class="hint" style="margin-bottom:0">Reviens quand tu l'as vu — je te demanderai ce qu'il t'en reste.
    C'est ça qui débloque le prochain tirage.</p>
    <button class="btn" onclick="location.reload()">J'ai fini →</button>`;
  vue.appendChild(bloc);
  bloc.scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* --- 3. la serrure : raconte, et je te ressers --- */
function vueSerrure(a){
  vue.innerHTML=`<h2>Raconte</h2>
    <p class="hint">Tu as choisi <b>${a.titre||"ce film"}</b>. Qu'est-ce qu'il t'en reste ?
    Ce que tu as remarqué, ce qui t'a happé, ce qui t'a agacé — écris pour toi, pas pour les autres.
    Une phrase suffit ; plus tu m'en dis, mieux je te connais.
    <b>Tout état honnête compte</b> : « abandonné au bout de 40 minutes » est une réponse précieuse.</p>
    <div class="serrure">
      <h3>${a.titre||""}</h3>
      <textarea id="txt" placeholder="ce qui m'est resté…" autofocus></textarea>
      <div class="row">
        <button class="btn" id="env">Débloquer le prochain →</button>
        <span class="compte" id="err"></span>
      </div>
    </div>`;
  const txt=document.getElementById("txt"), err=document.getElementById("err");
  document.getElementById("env").addEventListener("click",async()=>{
    const t=txt.value.trim();
    if(t.length<3){ err.textContent="écris au moins une phrase"; txt.focus(); return; }
    await POST("/api/ressenti",{film_id:a.film_id,texte:t,titre:a.titre,registre:a.registre});
    router();
  });
}

router();
</script>
</body>
</html>
