<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MORDU — L'oracle</title>
<link rel="stylesheet" href="mordu.css">
<style>
  /* propre à l'oracle */
  .cartes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  /* PIÈGE : un élément ne peut PAS interroger son propre conteneur. Mettre
     container-type sur .carte en fait un conteneur pour ses ENFANTS ; la requête
     @container qui cible .carte interroge alors l'ancêtre au-dessus. D'où cet hôte
     dédié autour de chaque carte — c'est le motif correct. */
  .carte-hote{container-type:inline-size;display:flex}
  .carte{position:relative;border:1px solid var(--line);flex:1;
    background:var(--panel);display:flex;flex-direction:column;cursor:pointer;
    transition:border-color .18s, transform .18s, box-shadow .18s}
  .carte:hover{border-color:var(--red);transform:translateY(-4px);
    box-shadow:0 10px 34px -18px rgba(228,19,15,.75)}
  .carte .frame{position:relative;aspect-ratio:2/3;max-height:36vh;overflow:hidden;background:#0a0c10}
  .carte canvas{width:100%;height:100%;display:block;image-rendering:pixelated;object-fit:cover}
  .carte .reg{position:absolute;left:0;top:0;font-family:var(--mono);font-size:9px;
    letter-spacing:.14em;text-transform:uppercase;color:#0b0b0b;background:var(--red);padding:4px 8px}
  .carte .body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
  .carte .annonce{font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.04em}
  /* le titre du film révélé : GRAND MOMENT -> l'ombre rouge a sa place ici */
  .carte .titre{font-family:var(--disp);text-transform:uppercase;font-size:20px;line-height:1.03;
    text-shadow:1.5px 1.5px 0 var(--red);opacity:0;transition:opacity .45s}
  .carte.revele .titre{opacity:1}
  .carte .arg{font-size:14.5px;line-height:1.45}
  .carte .crou{font-size:12px;line-height:1.45;color:var(--mut);border-left:2px solid var(--red);padding-left:9px}
  .carte .pari{font-size:12px;line-height:1.45;color:var(--mut);font-style:italic}
  .carte .pari b{color:var(--ink);font-style:normal}
  .carte .souffle{font-family:var(--mono);font-size:9.5px;color:var(--green);letter-spacing:.05em}
  .carte .meta{font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:auto;padding-top:8px}
  .carte.efface{opacity:.12;filter:saturate(.2);pointer-events:none;transition:opacity .6s,filter .6s}

  /* relecture : on PROPOSE, on n'impose pas — le brut reste toujours ta version */
  .relu{border-left:2px solid var(--green);padding:9px 0 9px 12px;margin-top:12px;display:none}
  .relu.on{display:block}
  .relu .t{font-size:13.5px;line-height:1.55}
  .relu .chg{font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:7px;line-height:1.6}
  .relu .chg b{color:var(--green);font-weight:400}
  .relu .chg s{color:var(--red);text-decoration:line-through;opacity:.75}
  .jugement{border-left:2px solid var(--red);padding-left:12px;margin:2px 0 16px}
  .jugement .q{font-size:13.5px;line-height:1.5;color:var(--mut)}
  .jugement .q b{color:var(--ink)}
  .serrure{border:1px solid var(--red);background:rgba(228,19,15,.06);padding:20px;margin-top:14px}
  /* onboarding : un film + POURQUOI. Sans le texte, une graine ne porte ni
     vocabulaire ni axe d'attention — le profil repose alors sur le premier
     ressenti écrit, qui le tire tout entier vers lui. */
  .choisi{border:1px solid var(--line);background:var(--panel);padding:11px 13px;margin-bottom:9px}
  .choisi .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .choisi .t{font-family:var(--disp);text-transform:uppercase;font-size:16px}
  .choisi .x{font-family:var(--mono);font-size:10px;color:var(--mut);cursor:pointer}
  .choisi .x:hover{color:var(--red)}
  .choisi textarea{min-height:56px;margin-top:7px;font-size:13.5px}
  .choisi.court{border-color:rgba(228,19,15,.5)}
  .choisi .cpt{font-family:var(--mono);font-size:9px;color:var(--mut);margin-top:3px}
  .res{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:11px;margin-top:14px}
  .res .f{cursor:pointer;border:1px solid transparent;transition:border-color .15s,transform .15s}
  .res .f:hover{transform:translateY(-3px)}
  .res .f canvas{width:100%;aspect-ratio:2/3;display:block;background:#111;image-rendering:pixelated}
  .res .f.on{border-color:var(--green)}
  .res .f .t{font-size:10.5px;margin-top:4px;line-height:1.15;color:var(--mut)}
  .res .f.on .t{color:var(--green)}

  /* la boîte aux lettres : on la VOIT, on n'y choisit jamais */
  .boite{margin-top:34px;border-top:1px solid var(--line);padding-top:18px}
  .boite .items{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .boite .it{position:relative;width:64px}
  .boite .it canvas{width:64px;height:96px;display:block;image-rendering:pixelated;background:#0a0c10;
    border:1px solid var(--line)}
  .boite .it .n{font-size:9.5px;color:var(--mut);margin-top:4px;line-height:1.15}
  .boite .it .x{position:absolute;right:2px;top:2px;font-family:var(--mono);font-size:9px;
    background:#0b0b0b;color:var(--mut);border:1px solid var(--line);padding:1px 4px;cursor:pointer}
  .boite .it .x:hover{color:var(--red);border-color:var(--red)}

  /* la grille passe en une colonne selon la FENÊTRE (c'est bien une décision de page) */
  @media(max-width:820px){ .cartes{grid-template-columns:1fr;gap:11px} }

  /* …mais la mise en page d'une CARTE dépend de SA propre largeur, pas de la fenêtre.
     Container query : la même carte reste correcte si tu la remets un jour dans une
     colonne étroite, une modale ou une sidebar. C'est la bonne unité de décision. */
  @container (max-width: 420px){
    .carte{flex-direction:row;align-items:flex-start}
    .carte .frame{width:98px;flex:0 0 98px;max-height:none;aspect-ratio:2/3}
    .carte .reg{left:0;right:0;top:0;text-align:center;font-size:7px;padding:3px 2px;
      letter-spacing:.06em;white-space:nowrap}
    .carte .body{padding:11px 12px} .carte .arg{font-size:14px} .carte .crou{display:none}
    .carte.revele{flex-direction:column}
    .carte.revele .frame{width:100%;flex:0 0 auto;max-height:44vh}
    .carte.revele .crou{display:block}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 class="brand"><a href="index.html">MORDU</a></h1>
    <span class="status" id="status">connexion…</span>
  </div>
  <nav class="nav">
    <a href="index.html">Accueil</a>
    <a href="oracle.html" aria-current="page">L'oracle</a>
    <a href="profil.html">Mon profil</a>
    <a href="domaines.html">Domaines</a>
  </nav>
  <div id="vue"></div>
  <div class="boite" id="boite" hidden></div>
</div>

<script src="mordu.js"></script>
<script>
const API = new URLSearchParams(location.search).get("api") || "http://127.0.0.1:8000";
const vue = document.getElementById("vue"), statusEl = document.getElementById("status");
function setStatus(ok,t){ statusEl.className="status "+(ok?"ok":"ko"); statusEl.textContent=t; }
async function GET(p){ const r=await fetch(API+p); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
async function POST(p,b){ const r=await fetch(API+p,{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify(b)}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }

MORDU.fond({opacite:.72});

const imgCache={};
function img(path){
  if(!path) return null;
  if(imgCache[path]) return imgCache[path];
  const im=new Image(); im.crossOrigin="anonymous";
  im.src=`${API}/api/img?path=${encodeURIComponent(path)}&w=342`;
  imgCache[path]=im; return im;
}
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
function titre(el,txt,retard){ MORDU.resoudreTexte(el,txt,{duree:750,retard:retard||0}); }

let vivants=[];                     // boucles de rendu à couper au changement de vue
function nettoyer(){ vivants.forEach(v=>v.arreter&&v.arreter()); vivants=[]; }

/* ---------- routeur ---------- */
async function router(){
  nettoyer();
  let etat;
  try{
    const h=await GET("/api/health"); etat=await GET("/api/etat");
    setStatus(true,`oracle en ligne · ${h.films} films · ${etat.aretes} arête${etat.aretes>1?"s":""}`);
  }catch(e){
    setStatus(false,"API hors ligne");
    vue.innerHTML=`<div class="banner"><b>API injoignable</b> sur <code>${API}</code>.
      Lance <code>uvicorn main:app --reload</code> depuis <code>backend/</code> et recharge.</div>`;
    return;
  }
  const o=await GET("/api/oracle");
  if(o.besoin_onboarding) return vueOnboarding();
  if(o.bloque) return vueSerrure(o.en_attente);
  return vueCartes(o.cartes);
}

/* --- 1. onboarding : des arêtes, pas des cases à cocher --- */
function vueOnboarding(){
  const N=5, MIN=15;
  vue.innerHTML=`<h2 id="h"></h2>
    <p class="hint">Cite <b>${N} films</b> que tu as adorés — et pour chacun, <b>une ligne
    sur ce qui t'a marqué</b>. Le texte n'est pas décoratif : c'est lui qui porte ton
    vocabulaire et tes axes d'attention.<span class="long"> Sans lui je n'ai que des
    titres, et mon premier ressenti écrit tirerait tout le profil vers lui.</span></p>
    <input type="text" id="q" placeholder="cherche un film…" autocomplete="off">
    <div class="res" id="res"></div>
    <div id="liste" style="margin-top:16px"></div>
    <div class="row"><button class="btn" id="ok" disabled>Commencer →</button>
      <span class="compte" id="cpt">0 / ${N}</span></div>`;
  titre(document.getElementById("h"),"D'abord, cinq films");
  const q=document.getElementById("q"), res=document.getElementById("res"),
        liste=document.getElementById("liste"), ok=document.getElementById("ok"),
        cpt=document.getElementById("cpt");
  let choisis=[], last=0;

  function pret(){
    const n=choisis.length;
    const tousDecrits=choisis.every(c=>(c.texte||"").trim().length>=MIN);
    cpt.textContent=`${n} / ${N}`+(n===N&&!tousDecrits?" — il manque des descriptions":"");
    ok.disabled=!(n===N&&tousDecrits);
  }
  function rendreListe(){
    liste.innerHTML=choisis.map((c,i)=>`<div class="choisi" data-i="${i}">
      <div class="h"><span class="t">${esc(c.title)}</span><span class="x">retirer ✕</span></div>
      <textarea placeholder="ce qui t'a marqué dans ce film…">${esc(c.texte||"")}</textarea>
      <div class="cpt"></div></div>`).join("");
    liste.querySelectorAll(".choisi").forEach((el,i)=>{
      const ta=el.querySelector("textarea"), cp=el.querySelector(".cpt");
      const maj=()=>{ choisis[i].texte=ta.value;
        const n=ta.value.trim().length;
        el.classList.toggle("court", n>0 && n<MIN);
        cp.textContent = n>=MIN ? "✓" : `${n}/${MIN} caractères minimum`;
        pret(); };
      ta.addEventListener("input",maj); maj();
      el.querySelector(".x").addEventListener("click",()=>{
        choisis.splice(i,1); rendreListe(); pret(); });
    });
  }

  q.addEventListener("input",async()=>{
    const s=q.value.trim(); if(s.length<2){res.innerHTML="";return;}
    const t=++last; const films=await GET(`/api/movies?search=${encodeURIComponent(s)}&limit=10`);
    if(t!==last) return;
    res.innerHTML=films.map(f=>`<div class="f${choisis.find(c=>c.id===f.id)?' on':''}"
      data-id="${f.id}"><canvas></canvas><div class="t">${esc(f.title)}</div></div>`).join("");
    res.querySelectorAll(".f").forEach((el,i)=>{
      const f=films[i];
      // NET : tu cherches un film que tu CONNAIS. Le tramer ici ne cachait rien
      // d'utile — ça rendait juste la recherche plus difficile.
      const im=img(f.poster_path);
      const go=()=>MORDU.tramer(el.querySelector("canvas"), im,
        {net:1, temperature:MORDU.temperature(f), w:110, h:165});
      if(im && !im.complete) im.addEventListener("load",go,{once:true});
      go();
      el.addEventListener("click",()=>{
        if(choisis.find(c=>c.id===f.id)) return;
        if(choisis.length>=N){ cpt.textContent=`${N} maximum — retire-en un`; return; }
        choisis.push({id:f.id,title:f.title,texte:""});
        q.value=""; res.innerHTML=""; rendreListe(); pret();
      });
    });
  });

  ok.addEventListener("click",async()=>{
    ok.disabled=true; ok.textContent="…";
    try{
      await POST("/api/graines",{films:choisis.map(c=>
        ({film_id:c.id,titre:c.title,texte:c.texte.trim()}))});
      router();
    }catch(e){ ok.disabled=false; ok.textContent="Commencer →";
      cpt.textContent="erreur — vérifie les descriptions"; }
  });
  pret();
}

/* --- 2. les trois cartes, à l'aveugle --- */
function vueCartes(cartes){
  if(!cartes || !cartes.length){
    vue.innerHTML=`<div class="banner">Pas de tirage possible — catalogue trop filtré.</div>`; return;
  }
  vue.innerHTML=`<h2 id="h"></h2>
    <p class="hint">Trois directions. Tu me dis de quoi tu as <b>envie</b><span class="long">,
    tu ne choisis pas un film parmi des milliers</span>. Les affiches restent tramées :
    choisis sur l'argument<span class="long">, pas sur la jaquette</span>. Le film se révèle après.</p>
    <div class="cartes">${cartes.map((c,i)=>`
      <div class="carte-hote"><div class="carte" data-i="${i}">
        <div class="frame"><canvas></canvas><span class="reg">${c.label}</span></div>
        <div class="body">
          <div class="annonce">${c.annonce}</div>
          ${c.de_la_boite?`<div class="souffle">↩ tu me l'avais déposé${typeof c.de_la_boite==="string"?" — "+c.de_la_boite:""}</div>`:``}
          <div class="titre"></div>
          <div class="arg">${c.argument}</div>
          ${c.pari?`<div class="pari">Je parie que <b>${c.pari}</b>.</div>`:``}
          ${c.croustillant?`<div class="crou">${c.croustillant}</div>`:``}
          <div class="meta">affinité ${c.affinite.toFixed(2)}</div>
        </div>
      </div></div>`).join("")}</div>`;
  titre(document.getElementById("h"),"Ce soir");
  const els=[...vue.querySelectorAll(".carte")];
  els.forEach((el,i)=>{
    const c=cartes[i], cv=el.querySelector("canvas");
    const r=el.getBoundingClientRect();
    const moteur=MORDU.animer(cv, img(c.poster_path), {
      net:.045, temperature:MORDU.temperature(c), pixMin:11,
      w:Math.max(120,Math.round(r.width||300)), h:Math.round((r.width||300)*1.5)
    });
    vivants.push(moteur);
    el.addEventListener("click",()=>choisir(el,els,cartes,i,moteur),{once:true});
  });
}

async function choisir(el, els, cartes, i, moteur){
  const c=cartes[i];
  els.forEach((x,j)=>{ if(j!==i) x.classList.add("efface"); x.style.pointerEvents="none"; });
  el.classList.add("revele");                       // le mobile repasse en colonne
  await new Promise(r=>setTimeout(r,60));           // laisse la mise en page se poser
  const cv=el.querySelector("canvas"), r=cv.getBoundingClientRect();
  moteur.net=moteur.net; Object.assign(moteur,{});
  await moteur.reveler(1600);
  titre(el.querySelector(".titre"), `${c.title} (${c.year})`);
  const dispo=(c.providers_fr||[]).slice(0,3).join(" · ");
  el.querySelector(".meta").innerHTML=
    `${c.runtime||"?"} min · ${(c.genres||[]).join(", ")}${dispo?`<br>${dispo}`:""}`;
  await POST("/api/choix",{film_id:c.id,titre:c.title,registre:c.registre,pari:c.pari});
  const bloc=document.createElement("div");
  bloc.className="serrure"; bloc.style.marginTop="22px";
  bloc.innerHTML=`<h3>C'est parti</h3>
    <p class="hint" style="margin-bottom:0">Reviens quand tu l'as vu — je te demanderai ce qu'il
    t'en reste. C'est ça qui débloque le prochain tirage.</p>
    <button class="btn" id="fini">J'ai fini →</button>`;
  vue.appendChild(bloc);
  bloc.querySelector("#fini").addEventListener("click",()=>router());
  bloc.scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* --- 3. la serrure : raconte, et je te ressers --- */
function vueSerrure(a){
  vue.innerHTML=`<h2 id="h"></h2>
    <p class="hint">Tu as choisi <b>${a.titre||"ce film"}</b>. Qu'est-ce qu'il t'en reste ?
    Ce que tu as remarqué, ce qui t'a happé, ce qui t'a agacé — écris pour toi, pas pour les autres.
    Une phrase suffit ; plus tu m'en dis, mieux je te connais.
    <b>Tout état honnête compte</b> : « abandonné au bout de 40 minutes » est une réponse précieuse.</p>
    <div class="serrure">
      <h3>${a.titre||""}</h3>
      ${a.pari?`<div class="jugement">
        <div class="q">J'avais parié que <b>${a.pari}</b>.</div>
        <div class="row" style="margin-top:8px">
          <button class="btn ghost" data-j="1">Bien vu</button>
          <button class="btn ghost" data-j="0">À côté</button>
          <span class="compte" id="verdict"></span>
        </div></div>`:``}
      <textarea id="txt" placeholder="ce qui m'est resté…" autofocus></textarea>
      <div class="relu" id="relu"></div>
      <div class="row">
        <button class="btn" id="env">Débloquer le prochain →</button>
        <button class="btn ghost" id="relire" hidden>Relire mes fautes</button>
        <button class="btn ghost" id="renonce">Pas encore vu</button>
        <span class="compte" id="err"></span>
      </div>
      <p class="compte" style="margin-top:10px;max-width:60ch;line-height:1.6">
        Pas encore vu ? Dis-le : je rends la main sans rien écrire. On ne punit que le
        silence, pas l'attente.</p>
    </div>`;
  titre(document.getElementById("h"),"Raconte");
  const txt=document.getElementById("txt"), err=document.getElementById("err");
  // Le pari appartient à l'ORACLE : c'est LUI qu'on note, jamais toi. Tu ne peux
  // pas échouer ici — c'est ce qui distingue ça d'un streak (MANIFESTE §9).
  let juge=null;
  vue.querySelectorAll("[data-j]").forEach(b=>b.addEventListener("click",()=>{
    juge = b.dataset.j==="1";
    vue.querySelectorAll("[data-j]").forEach(x=>x.style.borderColor="");
    b.style.borderColor="var(--red)";
    document.getElementById("verdict").textContent = juge?"noté pour lui":"il s'en souviendra";
  }));
  // RELECTURE — orthographe et phrases cassées uniquement. Le texte brut n'est jamais
  // remplacé : la correction part dans un champ à part, et ton vocabulaire (dans le
  // profil) continue de se lire sur le brut. Sinon le portrait afficherait les mots du
  // modèle à la place des tiens.
  let corrige=null;
  const bRelire=document.getElementById("relire"), relu=document.getElementById("relu");
  GET("/api/relecture_dispo").then(d=>{ if(d.disponible) bRelire.hidden=false; }).catch(()=>{});
  bRelire.addEventListener("click",async()=>{
    const t=txt.value.trim();
    if(t.length<3){ err.textContent="écris d'abord"; return; }
    bRelire.textContent="Relecture…";
    try{
      const r=await POST("/api/relire",{film_id:a.film_id,texte:t});
      if(!r.ok){ err.textContent=r.raison||"rien à corriger"; bRelire.textContent="Relire mes fautes"; return; }
      corrige=r.corrige;
      relu.className="relu on";
      relu.innerHTML=`<div class="t">${esc(r.corrige)}</div>
        ${r.changements.length?`<div class="chg">${r.changements.map(c=>
          `<s>${esc(c.avant)}</s> → <b>${esc(c.apres)}</b> <span style="opacity:.6">(${esc(c.type)})</span>`
        ).join("<br>")}</div>`:`<div class="chg">Aucune faute trouvée.</div>`}
        <div class="chg" style="opacity:.8">Ta version d'origine est conservée telle quelle —
        c'est elle qui alimente « les mots que tu emploies » dans ton profil.</div>`;
    }catch(e){ err.textContent="relecture indisponible"; }
    bRelire.textContent="Relire mes fautes";
  });

  document.getElementById("renonce").addEventListener("click",async()=>{
    await fetch(API+"/api/renoncer",{method:"POST"});
    router();
  });
  document.getElementById("env").addEventListener("click",async()=>{
    const t=txt.value.trim();
    if(t.length<3){ err.textContent="écris au moins une phrase"; txt.focus(); return; }
    const r=await POST("/api/ressenti",{film_id:a.film_id,texte:t,titre:a.titre,
      registre:a.registre,pari:a.pari,pari_juste:juge,corrige:corrige});
    if(r.palmares&&r.palmares.score!==null)
      setStatus(true,`l'oracle te connaît à ${Math.round(r.palmares.score*10)}/10`);
    router();
  });
}

/* --- 4. la boîte aux lettres (MANIFESTE §6) -----------------------------------
   Ce n'est PAS une watchlist : aucun ordre, aucun bouton « regarder celui-là ».
   On y dépose ce qu'un pote t'a soufflé, et c'est l'ORACLE qui décide quand
   l'heure est venue. La voir sans pouvoir y piocher, c'est tout le principe. */
const boiteEl=document.getElementById("boite");

async function rendreBoite(){
  let items=[];
  try{ items=await GET("/api/boite"); }catch(e){ return; }
  boiteEl.hidden=false;
  boiteEl.innerHTML=`<h2 id="hb"></h2>
    <p class="hint"><b>À quoi ça sert :</b> quand un pote te conseille un film, tu le
    déposes ici — et tu l'oublies. Il ne devient pas une tâche à faire : il rejoint
    simplement les candidats que l'oracle peut te servir, et c'est <b>lui</b> qui choisit
    le bon soir. ${items.length?`<b>${items.length}</b> film${items.length>1?"s":""} en attente.`:`Elle est vide pour l'instant.`}
    <br><br><b>Pourquoi ce n'est pas une watchlist :</b> dans une watchlist, c'est toi qui
    reviens la consulter et qui choisis dedans — donc elle s'allonge, te regarde, et
    devient une dette. Ici il n'y a <b>ni ordre, ni bouton « regarder celui-là »</b>.
    Tu déposes, tu oublies ; un soir il ressort dans tes trois cartes, avec la mention
    de qui te l'avait soufflé.</p>
    <div class="row">
      <input type="text" id="qb" placeholder="déposer un film…" autocomplete="off" style="max-width:300px">
      <input type="text" id="src" placeholder="de qui ? (facultatif)" style="max-width:190px">
    </div>
    <div class="res" id="resb" style="grid-template-columns:repeat(auto-fill,minmax(78px,1fr))"></div>
    <div class="items" id="itemsb"></div>`;
  titre(document.getElementById("hb"),"La boîte aux lettres");

  const it=document.getElementById("itemsb");
  it.innerHTML=items.map(b=>`<div class="it" data-id="${b.film_id}">
      <span class="x" title="retirer">✕</span><canvas></canvas>
      <div class="n">${b.titre||""}${b.source?`<br><span style="opacity:.65">${b.source}</span>`:""}</div>
    </div>`).join("");
  it.querySelectorAll(".it").forEach((el,i)=>{
    const b=items[i];
    // NET : tu as déposé ces films toi-même, tu sais ce que c'est.
    const im=img(b.poster_path);
    const go=()=>MORDU.tramer(el.querySelector("canvas"), im,
      {net:1, temperature:MORDU.temperature(b), w:64, h:96});
    if(im&&!im.complete) im.addEventListener("load",go,{once:true});
    go();
    el.querySelector(".x").addEventListener("click",async()=>{
      await fetch(`${API}/api/boite/${b.film_id}`,{method:"DELETE"}); rendreBoite();
    });
  });

  const qb=document.getElementById("qb"), resb=document.getElementById("resb"),
        src=document.getElementById("src");
  let last=0;
  qb.addEventListener("input",async()=>{
    const q=qb.value.trim(); if(q.length<2){resb.innerHTML="";return;}
    const t=++last; const films=await GET(`/api/movies?search=${encodeURIComponent(q)}&limit=8`);
    if(t!==last) return;
    resb.innerHTML=films.map(f=>`<div class="f" data-id="${f.id}"><canvas></canvas>
      <div class="t">${f.title}</div></div>`).join("");
    resb.querySelectorAll(".f").forEach((el,i)=>{
      const f=films[i];
      MORDU.tramer(el.querySelector("canvas"), img(f.poster_path),
        {net:1,temperature:MORDU.temperature(f),w:78,h:117});
      el.addEventListener("click",async()=>{
        await POST("/api/boite",{film_id:f.id,titre:f.title,source:src.value.trim()||null});
        qb.value=""; resb.innerHTML=""; rendreBoite();
      });
    });
  });
}

router().then(rendreBoite);
</script>
</body>
</html>
