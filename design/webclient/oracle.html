<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MORDU — L'oracle</title>
<style>
  :root{ --bg:#08090B; --panel:#0E1013; --ink:#E9E7DD; --mut:#83837B; --line:rgba(255,255,255,.11);
    --red:#E4130F; --green:#3FA45A;
    --disp:"Impact","Haettenschweiler","Arial Narrow",sans-serif;
    --sans:-apple-system,"Helvetica Neue",Arial,sans-serif; --mono:"SF Mono",ui-monospace,Menlo,monospace; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{position:relative;z-index:1;max-width:1140px;margin:0 auto;padding:22px 20px 80px}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{font-family:var(--disp);font-size:34px;letter-spacing:.02em;text-transform:uppercase;
    text-shadow:3px 3px 0 var(--red);margin:0}
  .brand a{color:inherit;text-decoration:none}
  .status{font-family:var(--mono);font-size:11px;padding:5px 9px;border:1px solid var(--line)}
  .status.ok{color:var(--green);border-color:var(--green)} .status.ko{color:var(--red);border-color:var(--red)}
  h2{font-family:var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:.02em;
    font-size:27px;text-shadow:2px 2px 0 var(--red);margin:22px 0 5px;min-height:1.05em}
  .hint{color:var(--mut);font-size:13px;margin:0 0 20px;max-width:68ch;line-height:1.55}
  .banner{padding:14px 16px;border:1px solid var(--red);font-size:14px;line-height:1.5;
    background:rgba(228,19,15,.08);margin-top:16px}
  .banner code{font-family:var(--mono);color:var(--red)}

  /* --- les trois cartes --- */
  .cartes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .carte{position:relative;border:1px solid var(--line);background:var(--panel);
    display:flex;flex-direction:column;cursor:pointer;
    transition:border-color .18s, transform .18s, box-shadow .18s}
  .carte::after{content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 0 0 var(--red);transition:box-shadow .18s}
  .carte:hover{border-color:var(--red);transform:translateY(-4px);
    box-shadow:0 10px 34px -18px rgba(228,19,15,.75)}
  .carte .frame{position:relative;aspect-ratio:2/3;max-height:36vh;overflow:hidden;background:#0a0c10}
  .carte canvas{width:100%;height:100%;display:block;image-rendering:pixelated;object-fit:cover}
  .carte .reg{position:absolute;left:0;top:0;font-family:var(--mono);font-size:9px;
    letter-spacing:.14em;text-transform:uppercase;color:#0b0b0b;background:var(--red);padding:4px 8px}
  .carte .body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
  .carte .annonce{font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.04em}
  .carte .titre{font-family:var(--disp);text-transform:uppercase;font-size:20px;line-height:1.03;
    text-shadow:1.5px 1.5px 0 var(--red);opacity:0;transition:opacity .45s}
  .carte.revele .titre{opacity:1}
  .carte .arg{font-size:14.5px;line-height:1.45}
  .carte .crou{font-size:12px;line-height:1.45;color:var(--mut);border-left:2px solid var(--red);
    padding-left:9px}
  .carte .meta{font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:auto;padding-top:8px}
  .carte.efface{opacity:.12;filter:saturate(.2);pointer-events:none;transition:opacity .6s,filter .6s}

  /* --- serrure / ressenti --- */
  .serrure{border:1px solid var(--red);background:rgba(228,19,15,.06);padding:20px;margin-top:14px}
  .serrure h3{font-family:var(--disp);text-transform:uppercase;font-size:22px;margin:0 0 6px;
    text-shadow:2px 2px 0 var(--red)}
  textarea{width:100%;min-height:130px;background:#07080A;color:var(--ink);border:1px solid var(--line);
    padding:12px;font-family:var(--sans);font-size:14.5px;line-height:1.55;resize:vertical}
  textarea:focus{outline:none;border-color:var(--red)}
  .btn{all:unset;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;padding:11px 18px;border:1px solid var(--red);color:var(--ink);
    background:#150f0f;margin-top:12px;display:inline-block;transition:background .15s,color .15s}
  .btn:hover{background:var(--red);color:#0b0b0b}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .compte{font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:8px}

  /* --- onboarding --- */
  input[type=text]{background:#07080A;color:var(--ink);border:1px solid var(--line);padding:11px 13px;
    font-family:var(--sans);font-size:14px;width:100%;max-width:430px}
  input[type=text]:focus{outline:none;border-color:var(--red)}
  .res{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:11px;margin-top:14px}
  .res .f{cursor:pointer;border:1px solid transparent;transition:border-color .15s,transform .15s}
  .res .f:hover{transform:translateY(-3px)}
  .res .f canvas{width:100%;aspect-ratio:2/3;display:block;background:#111;image-rendering:pixelated}
  .res .f.on{border-color:var(--green)}
  .res .f .t{font-size:10.5px;margin-top:4px;line-height:1.15;color:var(--mut)}
  .res .f.on .t{color:var(--green)}

  @media(max-width:820px){
    .wrap{padding:14px 14px 40px}
    .brand{font-size:25px} h2{font-size:20px;margin:12px 0 3px}
    .hint{font-size:12px;margin-bottom:12px} .hint .long{display:none}
    .status{font-size:10px;padding:4px 7px}
    .cartes{grid-template-columns:1fr;gap:11px}
    .carte{flex-direction:row;align-items:flex-start}
    .carte .frame{width:98px;flex:0 0 98px;max-height:none;aspect-ratio:2/3}
    .carte .reg{left:0;right:0;top:0;text-align:center;font-size:7px;padding:3px 2px;
      letter-spacing:.06em;white-space:nowrap}
    .carte .body{padding:11px 12px} .carte .arg{font-size:14px} .carte .crou{display:none}
    .carte.revele{flex-direction:column}
    .carte.revele .frame{width:100%;flex:0 0 auto;max-height:44vh}
    .carte.revele .crou{display:block}
  }
  @media(prefers-reduced-motion:reduce){ .carte{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 class="brand"><a href="index.html">MORDU</a></h1>
    <span class="status" id="status">connexion…</span>
  </div>
  <div id="vue"></div>
</div>

<script src="mordu.js"></script>
<script>
const API = new URLSearchParams(location.search).get("api") || "http://127.0.0.1:8000";
const vue = document.getElementById("vue"), statusEl = document.getElementById("status");
function setStatus(ok,t){ statusEl.className="status "+(ok?"ok":"ko"); statusEl.textContent=t; }
async function GET(p){ const r=await fetch(API+p); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
async function POST(p,b){ const r=await fetch(API+p,{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify(b)}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }

MORDU.fond({opacite:.55});

const imgCache={};
function img(path){
  if(!path) return null;
  if(imgCache[path]) return imgCache[path];
  const im=new Image(); im.crossOrigin="anonymous";
  im.src=`${API}/api/img?path=${encodeURIComponent(path)}&w=342`;
  imgCache[path]=im; return im;
}
function titre(el,txt,retard){ MORDU.resoudreTexte(el,txt,{duree:750,retard:retard||0}); }

let vivants=[];                     // boucles de rendu à couper au changement de vue
function nettoyer(){ vivants.forEach(v=>v.arreter&&v.arreter()); vivants=[]; }

/* ---------- routeur ---------- */
async function router(){
  nettoyer();
  let etat;
  try{
    const h=await GET("/api/health"); etat=await GET("/api/etat");
    setStatus(true,`oracle en ligne · ${h.films} films · ${etat.aretes} arête${etat.aretes>1?"s":""}`);
  }catch(e){
    setStatus(false,"API hors ligne");
    vue.innerHTML=`<div class="banner"><b>API injoignable</b> sur <code>${API}</code>.
      Lance <code>uvicorn main:app --reload</code> depuis <code>backend/</code> et recharge.</div>`;
    return;
  }
  const o=await GET("/api/oracle");
  if(o.besoin_onboarding) return vueOnboarding();
  if(o.bloque) return vueSerrure(o.en_attente);
  return vueCartes(o.cartes);
}

/* --- 1. onboarding : des arêtes, pas des cases à cocher --- */
function vueOnboarding(){
  vue.innerHTML=`<h2 id="h"></h2>
    <p class="hint">Cite trois films que tu as <b>adorés</b>. Pas les meilleurs — ceux qui sont restés.
    C'est tout ce dont j'ai besoin pour commencer<span class="long"> ; le reste, tu me le raconteras
    au fil des soirs</span>.</p>
    <input type="text" id="q" placeholder="cherche un film…" autocomplete="off">
    <div class="res" id="res"></div>
    <div class="row"><button class="btn" id="ok" style="display:none">Commencer →</button>
      <span class="compte" id="cpt">0 / 3</span></div>`;
  titre(document.getElementById("h"),"D'abord, trois films");
  const q=document.getElementById("q"), res=document.getElementById("res"),
        ok=document.getElementById("ok"), cpt=document.getElementById("cpt");
  let choisis=[], last=0;
  q.addEventListener("input",async()=>{
    const s=q.value.trim(); if(s.length<2){res.innerHTML="";return;}
    const t=++last; const films=await GET(`/api/movies?search=${encodeURIComponent(s)}&limit=12`);
    if(t!==last) return;
    res.innerHTML=films.map(f=>`<div class="f${choisis.find(c=>c.id===f.id)?' on':''}" data-id="${f.id}">
      <canvas></canvas><div class="t">${f.title}</div></div>`).join("");
    res.querySelectorAll(".f").forEach((el,i)=>{
      const f=films[i];
      // même matière que partout : les vignettes sont déjà tramées, à peine lisibles
      MORDU.tramer(el.querySelector("canvas"), img(f.poster_path),
        {net:.55, temperature:MORDU.temperature(f), w:110, h:165, pixMin:26});
      const im=img(f.poster_path);
      if(im && !im.complete) im.addEventListener("load",()=>MORDU.tramer(el.querySelector("canvas"),im,
        {net:.55,temperature:MORDU.temperature(f),w:110,h:165,pixMin:26}),{once:true});
      el.addEventListener("click",()=>{
        const j=choisis.findIndex(c=>c.id===f.id);
        if(j>=0) choisis.splice(j,1); else if(choisis.length<3) choisis.push(f);
        el.classList.toggle("on");
        cpt.textContent=`${choisis.length} / 3`;
        ok.style.display=choisis.length===3?"inline-block":"none";
      });
    });
  });
  ok.addEventListener("click",async()=>{ await POST("/api/graines",{ids:choisis.map(c=>c.id)}); router(); });
}

/* --- 2. les trois cartes, à l'aveugle --- */
function vueCartes(cartes){
  if(!cartes || !cartes.length){
    vue.innerHTML=`<div class="banner">Pas de tirage possible — catalogue trop filtré.</div>`; return;
  }
  vue.innerHTML=`<h2 id="h"></h2>
    <p class="hint">Trois directions. Tu me dis de quoi tu as <b>envie</b><span class="long">,
    tu ne choisis pas un film parmi des milliers</span>. Les affiches restent tramées :
    choisis sur l'argument<span class="long">, pas sur la jaquette</span>. Le film se révèle après.</p>
    <div class="cartes">${cartes.map((c,i)=>`
      <div class="carte" data-i="${i}">
        <div class="frame"><canvas></canvas><span class="reg">${c.label}</span></div>
        <div class="body">
          <div class="annonce">${c.annonce}</div>
          <div class="titre"></div>
          <div class="arg">${c.argument}</div>
          ${c.croustillant?`<div class="crou">${c.croustillant}</div>`:``}
          <div class="meta">affinité ${c.affinite.toFixed(2)}</div>
        </div>
      </div>`).join("")}</div>`;
  titre(document.getElementById("h"),"Ce soir");
  const els=[...vue.querySelectorAll(".carte")];
  els.forEach((el,i)=>{
    const c=cartes[i], cv=el.querySelector("canvas");
    const r=el.getBoundingClientRect();
    const moteur=MORDU.animer(cv, img(c.poster_path), {
      net:.045, temperature:MORDU.temperature(c), pixMin:11,
      w:Math.max(120,Math.round(r.width||300)), h:Math.round((r.width||300)*1.5)
    });
    vivants.push(moteur);
    el.addEventListener("click",()=>choisir(el,els,cartes,i,moteur),{once:true});
  });
}

async function choisir(el, els, cartes, i, moteur){
  const c=cartes[i];
  els.forEach((x,j)=>{ if(j!==i) x.classList.add("efface"); x.style.pointerEvents="none"; });
  el.classList.add("revele");                       // le mobile repasse en colonne
  await new Promise(r=>setTimeout(r,60));           // laisse la mise en page se poser
  const cv=el.querySelector("canvas"), r=cv.getBoundingClientRect();
  moteur.net=moteur.net; Object.assign(moteur,{});
  await moteur.reveler(1600);
  titre(el.querySelector(".titre"), `${c.title} (${c.year})`);
  const dispo=(c.providers_fr||[]).slice(0,3).join(" · ");
  el.querySelector(".meta").innerHTML=
    `${c.runtime||"?"} min · ${(c.genres||[]).join(", ")}${dispo?`<br>${dispo}`:""}`;
  await POST("/api/choix",{film_id:c.id,titre:c.title,registre:c.registre});
  const bloc=document.createElement("div");
  bloc.className="serrure"; bloc.style.marginTop="22px";
  bloc.innerHTML=`<h3>C'est parti</h3>
    <p class="hint" style="margin-bottom:0">Reviens quand tu l'as vu — je te demanderai ce qu'il
    t'en reste. C'est ça qui débloque le prochain tirage.</p>
    <button class="btn" id="fini">J'ai fini →</button>`;
  vue.appendChild(bloc);
  bloc.querySelector("#fini").addEventListener("click",()=>router());
  bloc.scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* --- 3. la serrure : raconte, et je te ressers --- */
function vueSerrure(a){
  vue.innerHTML=`<h2 id="h"></h2>
    <p class="hint">Tu as choisi <b>${a.titre||"ce film"}</b>. Qu'est-ce qu'il t'en reste ?
    Ce que tu as remarqué, ce qui t'a happé, ce qui t'a agacé — écris pour toi, pas pour les autres.
    Une phrase suffit ; plus tu m'en dis, mieux je te connais.
    <b>Tout état honnête compte</b> : « abandonné au bout de 40 minutes » est une réponse précieuse.</p>
    <div class="serrure">
      <h3>${a.titre||""}</h3>
      <textarea id="txt" placeholder="ce qui m'est resté…" autofocus></textarea>
      <div class="row">
        <button class="btn" id="env">Débloquer le prochain →</button>
        <span class="compte" id="err"></span>
      </div>
    </div>`;
  titre(document.getElementById("h"),"Raconte");
  const txt=document.getElementById("txt"), err=document.getElementById("err");
  document.getElementById("env").addEventListener("click",async()=>{
    const t=txt.value.trim();
    if(t.length<3){ err.textContent="écris au moins une phrase"; txt.focus(); return; }
    await POST("/api/ressenti",{film_id:a.film_id,texte:t,titre:a.titre,registre:a.registre});
    router();
  });
}

router();
</script>
</body>
</html>
