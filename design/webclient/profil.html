<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MORDU — Mon profil</title>
<link rel="stylesheet" href="mordu.css">
<style>
  .grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;margin-top:6px}
  .bloc{border:1px solid var(--line);background:var(--panel);padding:16px 17px}
  .bloc .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--mut);display:flex;align-items:center;gap:7px;margin-bottom:11px}
  .bloc .lbl::before{content:"";width:7px;height:7px;background:var(--red);flex:0 0 7px}

  /* barres : la longueur dit le poids, sans jamais afficher un score */
  .barre{margin-bottom:8px}
  .barre .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
  .barre .t span:last-child{font-family:var(--mono);font-size:10px;color:var(--mut)}
  .barre .j{height:5px;background:#191d24}
  .barre .j i{display:block;height:100%;background:var(--red)}

  .nuage{display:flex;flex-wrap:wrap;gap:7px}
  .nuage span{border:1px solid var(--line);padding:4px 9px;font-size:12.5px;color:var(--ink)}
  .nuage span.fort{border-color:var(--red);color:#fff}
  .liste{font-size:13.5px;line-height:1.75}
  .liste .n{font-family:var(--mono);font-size:10px;color:var(--mut);margin-left:6px}

  .voisins{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-top:4px}
  .voisins .v canvas{width:100%;aspect-ratio:2/3;display:block;background:#0a0c10;image-rendering:pixelated;
    border:1px solid var(--line)}
  .voisins .v .t{font-size:10.5px;line-height:1.2;margin-top:5px;color:var(--mut)}
  .voisins .v .a{font-family:var(--mono);font-size:9px;color:var(--red)}

  .arete{border-left:2px solid var(--red);padding:2px 0 2px 13px;margin-bottom:16px}
  .arete .h{font-family:var(--disp);text-transform:uppercase;font-size:16px;letter-spacing:.02em}
  .arete .d{font-family:var(--mono);font-size:9.5px;color:var(--mut);margin:2px 0 6px}
  .arete .x{font-size:13.5px;line-height:1.6;color:var(--ink);opacity:.9}
  .vide{color:var(--mut);font-size:13px;line-height:1.6}
  /* LA CARTE : plein cadre, tramée comme le reste — pas un scatter plot générique */
  .carte{position:relative;border:1px solid var(--line);background:#07080A;margin-top:8px;
    overflow:hidden}
  .carte canvas{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:crosshair}
  .carte .lg{position:absolute;left:0;right:0;bottom:0;padding:8px 11px;
    background:linear-gradient(transparent,rgba(7,8,10,.92) 55%);
    font-family:var(--mono);font-size:9.5px;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap}
  .carte .lg b{color:var(--ink);font-weight:400}
  .carte .lg i{display:inline-block;width:8px;height:8px;margin-right:4px;vertical-align:-1px}
  /* ANCHOR POSITIONING : l'infobulle s'accroche au canvas et se RETOURNE toute seule
     quand elle déborderait — @position-try remplace le calcul manuel de bord. */
  #cv{ anchor-name: --carte; }
  .carte .tip{position:absolute;pointer-events:none;background:#0b0b0b;border:1px solid var(--red);
    padding:4px 8px;font-size:11.5px;white-space:nowrap;transform:translate(-50%,-160%);opacity:0;
    transition:opacity .12s}
  @supports (anchor-name: --x){
    .carte .tip{ position-anchor: --carte; position-try-fallbacks: flip-block, flip-inline; }
  }
  .carte .tip.on{opacity:1}
  /* fiche d'inspection : cliquer un point de la carte */
  .fiche{position:absolute;right:12px;top:12px;width:230px;background:rgba(8,9,11,.95);
    border:1px solid var(--red);padding:11px 12px;font-size:12.5px;line-height:1.45;display:none}
  .fiche.on{display:block}
  .fiche canvas{width:100%;aspect-ratio:2/3;display:block;image-rendering:pixelated;
    background:#0a0c10;margin-bottom:8px}
  .fiche .t{font-family:var(--disp);text-transform:uppercase;font-size:16px;line-height:1.05}
  .fiche .m{font-family:var(--mono);font-size:9.5px;color:var(--mut);margin-top:4px}
  .fiche .x{position:absolute;right:6px;top:5px;cursor:pointer;color:var(--mut);
    font-family:var(--mono);font-size:11px}
  .fiche .x:hover{color:var(--red)}
  .terrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:9px;margin-top:12px}
  .terr{border:1px solid var(--line);padding:9px 11px;background:var(--panel)}
  .terr .n{font-size:12.5px;line-height:1.3}
  .terr .m{font-family:var(--mono);font-size:9.5px;color:var(--mut);margin-top:4px}
  .terr.mien{border-color:var(--red)}
  .terr.mien .m{color:var(--red)}
  /* LE PORTRAIT — ce qui se LIT. L'empreinte est une signature ; ceci est le portrait. */
  .portrait{border:1px solid var(--red);background:rgba(228,19,15,.04);padding:20px 22px;margin-bottom:16px}
  .portrait .p{font-size:19px;line-height:1.5;color:var(--ink);max-width:60ch}
  .portrait .p b{color:var(--red);font-weight:400}
  .portrait .ax{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));
    gap:8px;margin-top:18px}
  .portrait .a{border-left:2px solid var(--line);padding:3px 0 3px 10px}
  .portrait .a.on{border-left-color:var(--red)}
  .portrait .a .n{font-size:13px}
  .portrait .a.on .n{color:var(--ink)} .portrait .a .n{color:var(--mut)}
  .portrait .a .m{font-family:var(--mono);font-size:9.5px;color:var(--mut);margin-top:2px}
  .portrait .a.on .m{color:var(--red)}
  /* L'EMPREINTE : le vecteur profil (384D) rendu en glyphe */
  .emp{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
  .emp canvas{image-rendering:pixelated;border:1px solid var(--line);background:#0a0c10;
    width:216px;height:auto}
  .emp .txt{flex:1;min-width:190px;font-size:13px;line-height:1.6;color:var(--mut)}
  .emp .txt b{color:var(--ink)}
  .emp .fin{height:5px;background:#191d24;margin-top:9px}
  .emp .fin i{display:block;height:100%;background:var(--red);transition:width .5s}
  /* compléter les films de départ restés muets */
  .muet{border:1px solid var(--red);background:rgba(228,19,15,.05);padding:16px 17px;margin-bottom:16px}
  .muet .f{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
  .muet .f canvas{width:64px;height:96px;flex:0 0 64px;image-rendering:pixelated;background:#0a0c10}
  .muet .f .z{flex:1}
  .muet .f .t{font-family:var(--disp);text-transform:uppercase;font-size:15px}
  .muet textarea{min-height:52px;margin-top:5px;font-size:13px}
  .muet .cpt{font-family:var(--mono);font-size:9px;color:var(--mut);margin-top:3px}
  .jauge{font-family:var(--disp);font-size:40px;line-height:1;text-shadow:2px 2px 0 var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 class="brand"><a href="index.html">MORDU</a></h1>
    <span class="status" id="status">connexion…</span>
  </div>
  <nav class="nav">
    <a href="index.html">Accueil</a>
    <a href="oracle.html">L'oracle</a>
    <a href="profil.html" aria-current="page">Mon profil</a>
    <a href="domaines.html">Domaines</a>
    <a href="empreinte-evolution.html">Ton atlas</a>
  </nav>
  <h2 id="h"></h2>
  <p class="hint" id="intro"></p>
  <div id="vue"></div>
</div>

<script src="mordu.js"></script>
<script>
const API = new URLSearchParams(location.search).get("api") || "http://127.0.0.1:8000";
const st=document.getElementById("status"), vue=document.getElementById("vue");
async function GET(p){ const r=await fetch(API+p); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
MORDU.fond();

const imgCache={};
function img(path){
  if(!path) return null;
  if(imgCache[path]) return imgCache[path];
  const im=new Image(); im.crossOrigin="anonymous";
  im.src=`${API}/api/img?path=${encodeURIComponent(path)}&w=342`;
  imgCache[path]=im; return im;
}
const esc=s=>String(s??"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

function barres(items, cle, val){
  const max=Math.max(...items.map(i=>i[val]),1);
  return items.map(i=>`<div class="barre">
    <div class="t"><span>${esc(i[cle])}</span><span>${typeof i[val]==="number"?i[val].toFixed?i[val].toFixed(0):i[val]:""}</span></div>
    <div class="j"><i style="width:${Math.round(100*i[val]/max)}%"></i></div></div>`).join("");
}

(async()=>{
  let p, ars;
  try{
    p=await GET("/api/profil"); ars=await GET("/api/aretes");
    st.className="status ok"; st.textContent=`${p.films} films connus · ${p.aretes} arête${p.aretes>1?"s":""}`;
  }catch(e){
    st.className="status ko"; st.textContent="API hors ligne";
    vue.innerHTML=`<div class="banner"><b>API injoignable</b>. Lance
      <code>uvicorn main:app --reload</code> depuis <code>backend/</code>.</div>`;
    return;
  }
  MORDU.resoudreTexte(document.getElementById("h"),"Ce que je sais de toi",{duree:800});

  // Honnêteté d'abord : avec peu d'arêtes, on le DIT au lieu d'inventer un portrait.
  document.getElementById("intro").innerHTML = p.fiable
    ? `Tout ceci est <b>recalculé</b> depuis ce que tu as vu et écrit — rien n'est stocké.
       Si tu changes d'avis en racontant un film, le portrait change avec toi.`
    : `⚠︎ <b>Portrait encore mince</b> : ${p.aretes} ressenti${p.aretes>1?"s":""} seulement.
       Ce que tu lis vient surtout de tes films de départ, pas encore de ce que tu écris.
       Il faut environ <b>cinq</b> ressentis pour que ça dise vraiment quelque chose —
       et je préfère te le dire que te fabriquer un profil qui sonne juste sans l'être.`;

  const nuage = p.motifs.length
    ? `<div class="nuage">${p.motifs.map((m,i)=>`<span class="${i<3?'fort':''}">${esc(m.nom)}</span>`).join("")}</div>`
    : `<p class="vide">Pas encore assez de films pour dégager des motifs.</p>`;

  const vocab = p.vocabulaire.length
    ? `<div class="nuage">${p.vocabulaire.map((v,i)=>`<span class="${i<3?'fort':''}">${esc(v.mot)}</span>`).join("")}</div>
       <p class="vide" style="margin-top:10px">Ce que tu <b>mentionnes</b> est ton goût autant que
       ce que tu aimes : deux personnes adorent le même film pour des raisons opposées.</p>`
    : `<p class="vide">Tu n'as encore rien écrit. C'est pourtant là que se trouve
       ce que personne d'autre ne peut deviner de toi.</p>`;

  vue.innerHTML=`
    <div id="muet"></div>
    <div class="portrait apparait" id="portrait"></div>
    <div class="bloc apparait" style="margin-bottom:16px">
      <div class="lbl">Ton atlas — le cinéma vu depuis ta position</div>
      <div class="emp">
        <canvas id="emp" width="240" height="160"></canvas>
        <div class="txt" id="emptxt"></div>
      </div>
    </div>

    <h2 style="margin-top:30px" id="hd"></h2>
    <div class="grille">
      <div class="bloc apparait"><div class="lbl">Tes motifs</div>${nuage}</div>
      <div class="bloc apparait"><div class="lbl">Tes genres</div>${barres(p.genres,"nom","n")}</div>
      <div class="bloc apparait"><div class="lbl">Les mots que tu emploies</div>${vocab}</div>
      <div class="bloc apparait"><div class="lbl">Signatures</div>
        <div class="liste">
          ${p.realisateurs.map(r=>`<div>${esc(r.nom)}<span class="n">${r.n}</span></div>`).join("")||'<span class="vide">—</span>'}
        </div>
        <div class="lbl" style="margin-top:14px">Visages</div>
        <div class="liste">
          ${p.acteurs.slice(0,4).map(a=>`<div>${esc(a.nom)}<span class="n">${a.n}</span></div>`).join("")||'<span class="vide">—</span>'}
        </div>
      </div>
      <div class="bloc apparait"><div class="lbl">Ta forme</div>
        <div class="liste">
          <div>Durée moyenne <span class="n">${p.duree_moyenne??"—"} min</span></div>
          <div>Époque moyenne <span class="n">${p.annee_moyenne??"—"}</span></div>
        </div>
        <div class="lbl" style="margin-top:14px">L'oracle te connaît</div>
        ${/* PAS DE SCORE. Le produit affichait « 10/10 » sur UN pari jugé — sous
              l'hypothèse nulle d'une pièce, p = 0,50 : ça ne veut rigoureusement rien
              dire. Et l'élément s'appelait « jauge », que le §8 du manifeste enterre.
              On compte, on ne note pas. Un taux ne reviendra qu'au-delà de 20 paris,
              et avec son intervalle. */""}
        ${p.palmares && p.palmares.juges
          ? `<p class="vide">L'oracle a scellé <b>${p.palmares.paris}</b> pari${p.palmares.paris>1?"s":""},
             tu en as jugé <b>${p.palmares.juges}</b>.
             ${p.palmares.juges < 20
               ? `Trop peu pour en tirer un taux — sur ${p.palmares.juges},
                  même une pièce ferait aussi bien assez souvent pour qu'un chiffre mente.`
               : ""}</p>`
          : `<p class="vide">Aucun pari jugé pour l'instant. C'est <b>lui</b> qui est noté,
             jamais toi — tu ne peux pas échouer ici.</p>`}
      </div>
      <div class="bloc apparait"><div class="lbl">Ce vers quoi tu penches</div>
        <p class="vide" style="margin-bottom:9px">Les films du catalogue les plus proches de
        ton vecteur. Ce ne sont pas des recommandations — l'oracle, lui, arbitre aussi
        l'orthogonalité et ton envie du soir.</p>
        <div class="voisins" id="vois"></div>
      </div>
    </div>
    <h2 style="margin-top:30px" id="h2a"></h2>
    <div id="ars"></div>`;
  MORDU.resoudreTexte(document.getElementById("h2a"),"Tes ressentis",{duree:700});

  // ---- COMPLÉTER LES FILMS DE DÉPART MUETS ----
  // Une graine sans texte ne porte ni vocabulaire ni axe d'attention : elle ne pèse
  // que par son vecteur. La compléter AJOUTE une arête — rien n'est réécrit.
  try{
    const muets=await GET("/api/graines_muettes");
    if(muets.length){
      const MIN=15, el=document.getElementById("muet");
      el.className="muet";
      el.innerHTML=`<div class="lbl">Tes films de départ n'ont pas de description</div>
        <p class="vide" style="margin:0">Ces ${muets.length} films ne pèsent que par leur
        vecteur : ils n'apportent ni ton vocabulaire ni tes axes d'attention. Les décrire
        <b>ajoute</b> une arête — rien n'est effacé.</p>
        ${muets.map((m,i)=>`<div class="f" data-i="${i}"><canvas></canvas><div class="z">
          <div class="t">${esc(m.titre)}</div>
          <textarea placeholder="ce qui t'a marqué dans ce film…"></textarea>
          <div class="cpt"></div></div></div>`).join("")}
        <button class="btn" id="envm" disabled>Enregistrer →</button>`;
      const b=document.getElementById("envm");
      const etat=muets.map(()=>"");
      el.querySelectorAll(".f").forEach((f,i)=>{
        const m=muets[i], cv=f.querySelector("canvas"), im=img(m.poster_path);
        const go=()=>MORDU.tramer(cv,im,{net:1,temperature:MORDU.temperature(m),w:64,h:96});
        if(im&&!im.complete) im.addEventListener("load",go,{once:true}); go();
        const ta=f.querySelector("textarea"), cp=f.querySelector(".cpt");
        ta.addEventListener("input",()=>{
          etat[i]=ta.value; const n=ta.value.trim().length;
          cp.textContent = n>=MIN ? "✓" : (n?`${n}/${MIN} caractères minimum`:"");
          b.disabled = !etat.some(t=>t.trim().length>=MIN);
        });
      });
      b.addEventListener("click",async()=>{
        b.disabled=true; b.textContent="…";
        for(let i=0;i<muets.length;i++){
          const t=(etat[i]||"").trim();
          if(t.length<MIN) continue;
          await fetch(API+"/api/ressenti",{method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({film_id:muets[i].film_id,texte:t,titre:muets[i].titre,
                                 registre:"onboarding"})});
        }
        location.reload();
      });
    }
  }catch(e){}

  // ---- LE PORTRAIT (ce qui se LIT) ----
  // MANIFESTE §4 : « ce que tu MENTIONNES est ton axe d'attention ». L'empreinte est
  // unique et déterministe mais muette ; ceci est la moitié qui parle. Le signal le
  // plus fort n'est pas ce dont on parle le plus, c'est ce dont on ne parle JAMAIS.
  if(p.portrait){
    const P=p.portrait, el=document.getElementById("portrait");
    if(!P.aretes){
      el.innerHTML=`<div class="lbl">Ton portrait</div>
        <div class="p" style="font-size:15px;color:var(--mut)">Tu n'as encore rien écrit.
        Ce portrait se construit sur <b>ce que tu mentionnes</b> quand tu racontes un film —
        pas sur les films eux-mêmes.</div>`;
    } else {
      el.innerHTML=`<div class="lbl">Ton portrait${P.fiable?"":" — encore fragile"}</div>
        <div class="p">${esc(P.phrase)}</div>
        ${P.fiable?"":`<div class="vide" style="margin-top:9px">Sur ${P.aretes} ressenti${P.aretes>1?"s":""} seulement —
          il en faut environ quatre pour que ces axes veuillent dire quelque chose.</div>`}
        <div class="ax">${P.axes.map(a=>`<div class="a ${a.n?'on':''}">
          <div class="n">${esc(a.libelle)}</div>
          <div class="m">${a.n?`${a.n} mention${a.n>1?"s":""} · ${a.mots.slice(0,3).map(esc).join(", ")}`:"jamais mentionné"}</div>
        </div>`).join("")}</div>`;
    }
  }

  // ---- L'EMPREINTE ----
  // Ton goût EST déjà un objet mathématique unique : plutôt que de le résumer en
  // barres, on le montre tel quel — le vecteur replié en grille et quantifié sur la
  // palette. Déterministe, et il SE RÉSOUT à mesure que tu écris : c'est le même
  // principe que les affiches, appliqué à toi.
  // TON ATLAS — la vignette. L'empreinte qui était ici a été supprimée : elle peignait
  // le vecteur dans une base ARBITRAIRE (une rotation orthogonale laissait le modèle
  // rigoureusement identique et changeait 90 % de l'image). Ici on peint le CATALOGUE
  // dans une base fixe et on allume ce qui a été touché — chaque pixel se tapote et
  // rend de vrais titres. Détail et interaction sur la page dédiée.
  try{
    const A = await GET("/api/atlas");
    const cv = document.getElementById("emp"), ctx = cv.getContext("2d");
    const PAL = MORDU.PALETTE;
    cv.width = A.largeur; cv.height = A.hauteur;
    const im = ctx.createImageData(A.largeur, A.hauteur), d = im.data;
    A.socle.forEach((v,i)=>{
      const c = v===0 ? [22,24,28] : PAL[v];
      d[i*4]=c[0]; d[i*4+1]=c[1]; d[i*4+2]=c[2]; d[i*4+3]=255;
    });
    A.cellules.forEach(c=>{
      const base = PAL[Math.min(PAL.length-3, c.palier)];
      const col = c.braise ? [232,46,40] : base;
      d[c.c*4]=col[0]; d[c.c*4+1]=col[1]; d[c.c*4+2]=col[2]; d[c.c*4+3]=255;
    });
    ctx.putImageData(im,0,0);
    document.getElementById("emptxt").innerHTML=
      `Le cinéma entier projeté sur un plan — <b>${A.cellules_pleines}</b> cases habitées
       sur ${A.largeur*A.hauteur} — et les <b>${A.cellules.length}</b> où tu es allé.
       Ce qui est rouge date de moins d'un mois.
       <br><br>Chaque pixel contient de <b>vrais films</b> et sait lequel des tiens l'a
       allumé. C'est ce qui le distingue de l'empreinte qu'il remplace : là-bas, la
       position ne voulait rien dire — une rotation de l'espace laissait les
       recommandations rigoureusement identiques et changeait 90 % de l'image.
       <br><br><a href="empreinte-evolution.html" style="color:var(--red);font-size:12px">
       explorer l'atlas →</a>`;
  }catch(e){ document.getElementById("emptxt").textContent = "atlas indisponible"; }

  // LA CARTE DU GOÛT A ÉTÉ RETIRÉE D'ICI (22/07). Remarque de Martin : « l'atlas
  // ressemble trop au truc de mon profil » — et c'était exact : ce sont le MÊME objet.
  // Les deux partent de la même projection PaCMAP (carte._N), rendue une fois en nuage
  // de points ici et une fois en grille là-bas. Deux dessins pour une donnée, sur deux
  // écrans : la duplication affaiblissait les deux.
  //
  // L'atlas gagne parce qu'il fait tout ce que faisait la carte — territoires nommés,
  // inspection au clic, ta position — PLUS ce qu'elle ne faisait pas : le relief de ton
  // goût sur les 1086 cellules habitées, la chronologie rejouable, et la trace datée du
  // film qui a allumé chaque case. La vignette ci-dessus y mène.
  MORDU.resoudreTexte(document.getElementById("hd"),"Le détail",{duree:700,retard:200});

  const vs=document.getElementById("vois");
  vs.innerHTML=p.voisins.map(v=>`<div class="v"><canvas></canvas>
    <div class="t">${esc(v.title)}</div><div class="a">${v.affinite.toFixed(2)}</div></div>`).join("");
  vs.querySelectorAll(".v").forEach((el,i)=>{
    const v=p.voisins[i], cv=el.querySelector("canvas"), im=img(v.poster_path);
    const go=()=>MORDU.tramer(cv,im,{net:1,temperature:MORDU.temperature(v),w:88,h:132});
    if(im&&!im.complete) im.addEventListener("load",go,{once:true});
    go();
  });

  document.getElementById("ars").innerHTML = ars.length
    ? ars.slice().reverse().map(a=>`<div class="arete">
        <div class="h">${esc(a.titre||"—")}</div>
        <div class="d">${(a.date||"").slice(0,10)} · ressenti ${a.valence>=0.55?"très positif":a.valence>=0.2?"positif":a.valence>=-0.2?"mitigé":"négatif"}${a.abandonne?" · abandonné":""}</div>
        <div class="x">${esc(a.texte)}</div></div>`).join("")
    : `<p class="vide">Aucun ressenti pour l'instant. Chaque film que tu racontes ajoute une
       arête — et c'est la seule matière que MORDU possède et que personne d'autre n'a.</p>`;
})();
</script>
</body>
</html>
